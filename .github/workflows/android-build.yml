name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 【正解のステップ】
    # 壊れた内蔵ファイルは使わず、ここで安全なGradle(8.2.1)を新しく用意します。
    # 過去のゴミキャッシュを絶対に読み込まないよう「cache-disabled: true」を指定します。
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2.1'
        validate-wrappers: false
        cache-disabled: true

    # 内蔵コマンド(./gradlew)ではなく、新しく用意した安全なコマンド(gradle)を使います。
    - name: Build Debug APK
      working-directory: ./android
      run: gradle assembleDebug --no-build-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk