name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 【修正ポイント】17 から 21 へ変更
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Create Init Script
        run: |
          echo "allprojects {
            buildscript {
              configurations.all {
                resolutionStrategy {
                  force 'org.bouncycastle:bcprov-jdk18on:1.77'
                  force 'org.bouncycastle:bcpkix-jdk18on:1.77'
                }
              }
            }
            configurations.all {
              resolutionStrategy {
                force 'org.bouncycastle:bcprov-jdk18on:1.77'
                force 'org.bouncycastle:bcpkix-jdk18on:1.77'
              }
            }
          }" > init.gradle

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --init-script ../init.gradle -Pkotlin.plugin.statistics.enabled=false -Pkotlin.statistics.enabled=false --no-daemon --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk