name: Android Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Install & Build Web/Capacitor
        run: |
          npm install
          npm run build
          npx cap sync android

      # 【重要】Bouncy Castle 1.77 を全プロジェクトに強制適用
      - name: Create Init Script
        run: |
          echo "allprojects {
            buildscript {
              configurations.all {
                resolutionStrategy {
                  force 'org.bouncycastle:bcprov-jdk18on:1.77'
                  force 'org.bouncycastle:bcpkix-jdk18on:1.77'
                }
              }
            }
            configurations.all {
              resolutionStrategy {
                force 'org.bouncycastle:bcprov-jdk18on:1.77'
                force 'org.bouncycastle:bcpkix-jdk18on:1.77'
              }
            }
          }" > init.gradle

      - name: Build APK (using system gradle)
        working-directory: ./android
        # ./gradlew ではなく、setup-gradle で用意された gradle コマンドを直接使います
        run: gradle assembleDebug --init-script ../init.gradle -Pkotlin.plugin.statistics.enabled=false --no-daemon --no-build-cache --stacktrace