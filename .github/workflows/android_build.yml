name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Install dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Generate init.gradle for Bouncy Castle 1.77
      run: |
        cat <<EOF > init.gradle
        allprojects {
            buildscript {
                configurations.all {
                    resolutionStrategy {
                        force 'org.bouncycastle:bcprov-jdk18on:1.77'
                        force 'org.bouncycastle:bcpkix-jdk18on:1.77'
                    }
                }
            }
            configurations.all {
                resolutionStrategy {
                    force 'org.bouncycastle:bcprov-jdk18on:1.77'
                    force 'org.bouncycastle:bcpkix-jdk18on:1.77'
                }
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Fix Corrupt Assets
      run: |
        npm i -g @capacitor/assets
        node -e "
        const fs = require('fs');
        if (!fs.existsSync('assets')) fs.mkdirSync('assets');
        const buffer = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVQIW2NkYGD4z8DAwMgAI0AMCKcCB09uD0QAAAAASUVORK5CYII=', 'base64');
        fs.writeFileSync('assets/icon.png', buffer);
        fs.writeFileSync('assets/splash.png', buffer);
        "
        npx @capacitor/assets generate --android

    - name: Build Android APK
      run: |
        cd android
        gradle assembleDebug --init-script ../init.gradle -Pkotlin.plugin.statistics.enabled=false --no-daemon --no-build-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
