name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Install dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Generate init.gradle for Bouncy Castle 1.77
      run: |
        cat <<EOF > init.gradle
        allprojects {
            buildscript {
                configurations.all {
                    resolutionStrategy {
                        force 'org.bouncycastle:bcprov-jdk18on:1.77'
                        force 'org.bouncycastle:bcpkix-jdk18on:1.77'
                    }
                }
            }
            configurations.all {
                resolutionStrategy {
                    force 'org.bouncycastle:bcprov-jdk18on:1.77'
                    force 'org.bouncycastle:bcpkix-jdk18on:1.77'
                }
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Fix Corrupt PNGs
      run: |
        node -e "
        const fs = require('fs');
        const path = require('path');
        const validPngBase64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAAtJREFUGFdjYAACAAAFAAEE9nLzAAAAAElFTkSuQmCC';
        const buffer = Buffer.from(validPngBase64, 'base64');
        function replacePngs(dir) {
          if (fs.existsSync(dir)) {
            const list = fs.readdirSync(dir);
            for (const item of list) {
              const fullPath = path.join(dir, item);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                replacePngs(fullPath);
              } else if (item.endsWith('.png')) {
                fs.writeFileSync(fullPath, buffer);
                console.log('Replaced ' + fullPath);
              }
            }
          }
        }
        replacePngs('./android/app/src/main/res');
        "

    - name: Build Android APK
      run: |
        cd android
        gradle assembleRelease --init-script ../init.gradle -Pkotlin.plugin.statistics.enabled=false --no-daemon --no-build-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
