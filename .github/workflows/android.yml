name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Force Fix build.gradle
        run: |
          # android/app/build.gradle の中身を確認し、compileSdk がなければ強制的に書き込みます
          FILE="android/app/build.gradle"
          if ! grep -q "compileSdk" "$FILE"; then
            echo "compileSdk not found. Injecting..."
            # android { の直後に compileSdk = 36 を挿入します
            sed -i '/android {/a \    compileSdk = 36' "$FILE"
          fi
          
          # 念のため compileSdkVersion も追加して、古い形式にも対応させます
          sed -i '/android {/a \    compileSdkVersion = 36' "$FILE"
          
          # 最終的なファイルの中身をログに出力して確認
          echo "--- Final build.gradle content ---"
          cat "$FILE"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          # gradlew があればそれを使い、なければ gradle コマンドを使います
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk