name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Force Fix Build Settings
        run: |
          # android/app/build.gradle を強制的に「最も通る確率が高い形式」に書き換えます
          cat <<EOF > android/app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace "com.Kproject.app"
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.Kproject.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  aaptOptions {
                       noCompress 'traineddata'
                  }
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
              
              kotlinOptions {
                  jvmTarget = '21'
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation "com.getcapacitor:android-bridge:6.1.2"
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'com.rmtheis:tess-two:9.1.0'
              testImplementation 'junit:junit:4.13.2'
              androidTestImplementation 'androidx.test.ext:junit:1.2.1'
              androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
          }
          EOF
          
          # 大元の build.gradle も修正
          cat <<EOF > android/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.1'
                  classpath 'com.google.gms:google-services:4.4.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          
          # 書き換えた内容をログに出力して確認
          echo "--- Content of android/app/build.gradle ---"
          cat android/app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          # 壊れた gradlew を使わず、システム標準の gradle コマンドを直接使います
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk