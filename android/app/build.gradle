apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.Kproject.app"
    compileSdk 34
    
    defaultConfig {
        applicationId "com.Kproject.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        aaptOptions {
             noCompress 'traineddata'
        }
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    
    kotlinOptions {
        jvmTarget = '21'
    }
}

// 最新すぎる AndroidX ライブラリが API 36 を要求してクラッシュするのを防ぐため、
// API 34 と互換性のある安定版バージョンを強制的に使用させます。
configurations.all {
    resolutionStrategy {
        force 'androidx.activity:activity:1.9.3'
        force 'androidx.activity:activity-ktx:1.9.3'
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    
    // Capacitor 6 のコアライブラリをプロジェクトとして参照
    implementation project(':capacitor-android')
    
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.rmtheis:tess-two:9.1.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// Capacitor が自動生成するビルド設定を読み込む
// これにより、プラグインの依存関係が自動的に解決されます
try {
    def capacitorBuildGradle = file('capacitor.build.gradle')
    if (capacitorBuildGradle.exists()) {
        apply from: 'capacitor.build.gradle'
    }
} catch (Exception e) {
    logger.warn("capacitor.build.gradle not found, skipping plugin inclusion")
}
